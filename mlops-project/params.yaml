data:
  test_size: 0.2
  val_size: 0.1
  random_seed: 42
  target_column: Churn

model:
  algorithm: xgboost
  n_trials: 30
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 2.7
  eval_metric: aucpr

thresholds:
  risk_low: 0.35
  risk_high: 0.65
  min_f1: 0.80
  min_auc: 0.85
  drift_mild: 0.10
  drift_significant: 0.20

api:
  batch_max_rows: 5000
  upload_max_mb: 10
  drift_check_every_n: 100

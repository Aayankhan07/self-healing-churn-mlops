services:
  api:
    build: .
    ports: [ "8000:8000" ]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=sqlite:///./churnguard.db
      - ENV=${ENV:-development}
      - API_KEY=${API_KEY:-dev-key-change-in-prod}
    volumes:
      - ./reports:/app/reports
      - ./churnguard.db:/app/churnguard.db
    depends_on: [ mlflow ]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports: [ "5000:5000" ]
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db

  dashboard:
    build: .
    ports: [ "8501:8501" ]
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000
      - ENV=${ENV:-development}
      - API_KEY=${API_KEY:-dev-key-change-in-prod}
    depends_on: [ api ]

# Render Blueprint configuration for ChurnGuard MLOps Platform
# Free Tier Deployment Config

services:
  # 1. FastAPI Microservice Backend
  - type: web
    name: churnguard-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
    autoDeploy: true

databases:
  # 2. Managed PostgreSQL Database (Free Tier)
  - name: churnguard-db
    databaseName: churnguard
    user: churn_admin
